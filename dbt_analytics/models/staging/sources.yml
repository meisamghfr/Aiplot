version: 2

sources:
  - name: warehouse
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('warehouse', 'customers')
                    field: customer_id
          - name: revenue
            data_tests: [not_null]
